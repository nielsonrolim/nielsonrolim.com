services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - sqlite_data:/app/storage
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sqlite_data:
