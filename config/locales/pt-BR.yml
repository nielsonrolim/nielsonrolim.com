pt-BR:
  pages:
    home:
      title: "Nielson Rolim"
      whoami: "whoami"
      role: "Engenheiro de Software Sênior"
      location: "João Pessoa, Paraíba, Brasil"
      stack: "Ruby on Rails, Hotwire, React, TailwindCSS, Linux"
      bio: "Construo software há mais de uma década, com foco em sistemas backend robustos e produtos web que funcionam bem. Sou de João Pessoa e sou apaixonado por Linux e pela comunidade Ruby."
      language_label: "Idioma"
      theme_toggle: "Alternar tema claro/escuro"
      labels:
        role: "cargo"
        base: "base"
        stack: "stack"
      experience:
        prompt: "cat experience.log"
        show_all: "ver todas as %{count} experiências"
        show_less: "mostrar menos"
        jobs:
          - title: "Senior Software Engineer"
            company: "Light Labs Inc"
            period: "Mar 2025 – atual"
            summary: "Arquitetura, desenvolvimento e manutenção da plataforma principal da empresa para marcas e laboratórios, cobrindo fluxos de análise laboratorial, emissão de laudos (COA) e conformidade, com Ruby on Rails, Hotwire e PostgreSQL."
          - title: "Software Engineer"
            company: "Fluxx"
            period: "Out 2023 – Fev 2025"
            summary: "Desenvolvedor full-stack na plataforma de gestão de doações Fluxx Grantmaker, projetando e entregando novas funcionalidades e mantendo a base de código existente."
          - title: "Senior Software Engineer"
            company: "Shift"
            period: "Ago 2021 – Out 2023"
            summary: "Desenvolvi funcionalidades para a experiência de listagem, busca, filtro e detalhes de veículos, ajudei a construir uma solução unificada de autenticação e integrei o HubSpot ao CRM, com Rails, Hotwire/Turbo, Stimulus, React e AWS (Cognito, CloudSearch, DynamoDB, AppSync)."
          - title: "Software Engineer"
            company: "RD Station"
            period: "Abr 2021 – Ago 2021"
            summary: "Engenheiro backend na tribo de Gestão de Contatos, desenvolvendo funcionalidades para a plataforma RD Station Marketing com Ruby on Rails, PostgreSQL, Sidekiq e Redis."
          - title: "Backend Developer"
            company: "enjoei"
            period: "Out 2020 – Mar 2021"
            summary: "Desenvolvi funcionalidades do marketplace no time de segurança e risco financeiro e participei do design de uma biblioteca interna de rate limiting e da autenticação de dois fatores para usuários administrativos."
          - title: "Technology Consultant"
            company: "Lavanderia 60 Minutos"
            period: "Out 2020 – Jan 2022"
            summary: "Consultoria de tecnologia para os times de TI e gestão: liderei o time de desenvolvimento, levantei requisitos e desenhei soluções para novos projetos e funcionalidades."
          - title: "Senior Software Developer"
            company: "Lavanderia 60 Minutos"
            period: "Out 2019 – Out 2020"
            summary: "Projetei a arquitetura do software de uma rede de lavanderias self-service 100% automatizadas, com mais de 400 lojas no Brasil, desenvolvendo o sistema de gestão, a API dos terminais das lojas e a primeira versão do terminal em Raspberry Pi com touchscreen."
          - title: "CTO"
            company: "Fractal Tecnologia"
            period: "Fev 2018 – Out 2019"
            summary: "Liderei um time de 23 pessoas (desenvolvedores, DevOps, QA, gerentes de projeto e designers) e defini a arquitetura de software de todos os produtos e projetos, atuando com product management e clientes em requisitos e soluções customizadas."
          - title: "Project Manager"
            company: "Fractal Tecnologia"
            period: "Jun 2017 – Fev 2018"
            summary: "Gerenciei um time de 12 pessoas (desenvolvedores, testadores e designers) em diversos produtos da empresa e projetos de clientes."
          - title: "Co-Founder"
            company: "InvestFest"
            period: "Jan 2017 – Ago 2019"
            summary: "Cofundei uma startup de venda de ingressos para eventos e fui responsável pela arquitetura do backend e da API (Rails, Node.js, PostgreSQL, Redis e Sidekiq)."
          - title: "Rails Backend Developer"
            company: "Fractal Tecnologia"
            period: "Out 2016 – Jun 2017"
            summary: "Desenvolvi uma aplicação API-only em Rails 5 com PostgreSQL, Redis, Sidekiq, RSpec, Cucumber e Elasticsearch."
          - title: "Software Engineer"
            company: "Conductor Meios de Pagamento"
            period: "Abr 2016 – Out 2016"
            summary: "Trabalhei com Java, Oracle e MS SQL Server e atuei como analista de negócios documentando novas funcionalidades e estudando normas e regulamentações do sistema de pagamentos."
          - title: "iOS Developer"
            company: "Gennovacap"
            period: "Abr 2015 – Abr 2016"
            summary: "Desenvolvi o aplicativo Giusto em Objective-C e Swift, usando Parse como backend as a service."
          - title: "iOS Developer"
            company: "Mobilife"
            period: "Jul 2014 – Abr 2016"
            summary: "Desenvolvi aplicativos móveis institucionais para clientes da Mobilife em Objective-C e Swift."
          - title: "Development Manager"
            company: "Fácil Tecnologia"
            period: "Mai 2012 – Abr 2014"
            summary: "Gerenciei um time de desenvolvedores em projetos PHP de gestão de crédito consignado."
          - title: "iOS Developer"
            company: "MVarandas Tecnologia"
            period: "Jan 2011 – Abr 2012"
            summary: "Desenvolvi um novo aplicativo que permitia garçons registrarem pedidos em restaurantes."
          - title: "Web Developer"
            company: "NTI – UFPB"
            period: "Jan 2010 – Jan 2011"
            summary: "Desenvolvi o novo sistema de inscrição do vestibular da UFPB (COPERVE) com Ruby on Rails e SCRUM e atuei no software de processamento de resultados com Ruby, PostgreSQL e Oracle."
          - title: "Web Developer"
            company: "Conexão Comunicação"
            period: "Jan 2008 – Jul 2008"
            summary: "Desenvolvi sites e sistemas de gestão de conteúdo em PHP e MySQL."
          - title: "Co-Founder"
            company: "ArmazemWeb Hosting"
            period: "Jan 2000 – Dez 2007"
            summary: "Cofundei uma empresa de hospedagem, liderando suporte ao cliente e desenvolvimento web."
      education:
        prompt: "cat education.txt"
        items:
          - institution: "IFPB — Instituto Federal da Paraíba"
            credential: "Tecnólogo em Sistemas para Internet"
            year: "2014"
          - institution: "Kapi'olani Community College"
            credential: "Certificados de Competência em Programação, Administração de Banco de Dados e Help Desk"
            year: "2009"
      jampa_ruby:
        prompt: "cat jamparuby.txt"
        body_html: "Sou membro ativo da <a href=\"https://chat.whatsapp.com/Kan05TwASEtDItNK0ClCJT\">Jampa Ruby</a>, a comunidade de desenvolvedores Ruby da Paraíba, Brasil — parte da <a href=\"https://crudpb.org/\">CRUDPB</a>. Entre no grupo do WhatsApp e participe."
      projects:
        prompt: "cat projects.md"
        items:
          - name: "Lavanderia 60 Minutos"
            description: "Projetei a arquitetura de software de uma rede de lavanderias self-service 100% automatizadas, com mais de 400 lojas no Brasil. Desenvolvi o sistema de gestão e a API que comunica com os terminais das lojas, além da primeira versão do terminal do atendente, rodando em um Raspberry Pi com touchscreen, sincronizado com o sistema central e capaz de operar offline."
            tags: "Ruby on Rails, Node.js, PostgreSQL, Sidekiq, Redis, Raspberry Pi"
          - name: "IBAPE-PB — Sistema de Distribuição de Trabalhos"
            description: "Sistema de distribuição justa de trabalhos (perícias e avaliações) para associados do IBAPE-PB, via sorteio e indicação, cobrindo todo o ciclo de vida do trabalho (criação, publicação, sorteio, aceite, conclusão) com relatórios e notificações por e-mail."
            tags: "Ruby on Rails, PostgreSQL, Redis"
          - name: "Workspace Number Indicator"
            url: "https://github.com/nielsonrolim/workspace-number-indicator"
            description: "Extensão para o GNOME Shell que exibe o número da área de trabalho atual no painel superior, no formato apenas do workspace atual (2) ou atual/total (2 / 4). Compatível com GNOME Shell 45–50. Contribuição open-source."
            tags: "Open Source, GNOME Shell, GJS, JavaScript"
      contact:
        prompt: "cat contact.txt"
        email_label: "E-mail"
        github_label: "GitHub"
        linkedin_label: "LinkedIn"
      newsletter:
        prompt: "./subscribe.sh"
        body: "Receba uma newsletter sobre tecnologia."
        email_placeholder: "seu@email.com"
        submit: "Inscrever-se"
        nickname_label: "Deixe em branco"
