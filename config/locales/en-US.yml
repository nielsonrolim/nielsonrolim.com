  pages:
    home:
      title: "Nielson Rolim"
      whoami: "whoami"
      role: "Senior Software Engineer"
      location: "João Pessoa, Paraíba, Brazil"
      stack: "Ruby on Rails, Hotwire, React, TailwindCSS, Linux"
      bio: "I've been building software for over a decade, focused on robust backend systems and web products that work well. I'm based in João Pessoa and I'm passionate about Linux and the Ruby community."
