        base: "base"
        stack: "stack"
      experience:
        prompt: "cat experience.log"
        show_all: "show all %{count} experiences"
        show_less: "show less"
        jobs:
          - title: "Senior Software Engineer"
            company: "Light Labs Inc"
            period: "Mar 2025 – present"
            summary: "Architecture, development, and maintenance of the company's core platform for mission-driven brands and laboratories, covering lab testing workflows, COA issuance, and compliance tracking with Ruby on Rails, Hotwire, and PostgreSQL."
          - title: "Software Engineer"
            company: "Fluxx"
            period: "Oct 2023 – Feb 2025"
            summary: "Full-stack engineer on the Fluxx Grantmaker grants management platform, designing and shipping new features and maintaining the existing codebase."
          - title: "Senior Software Engineer"
            company: "Shift"
            period: "Aug 2021 – Oct 2023"
            summary: "Built features for the car listing, search, filter, and detail experience, helped build a unified authentication solution, and integrated HubSpot with the CRM using Rails, Hotwire/Turbo, Stimulus, React, and AWS (Cognito, CloudSearch, DynamoDB, AppSync)."
          - title: "Software Engineer"
            company: "RD Station"
            period: "Apr 2021 – Aug 2021"
            summary: "Backend engineer in the Contact Management tribe, building features for the RD Station Marketing platform with Ruby on Rails, PostgreSQL, Sidekiq, and Redis."
          - title: "Backend Developer"
            company: "enjoei"
            period: "Oct 2020 – Mar 2021"
            summary: "Built marketplace features in the security and financial risk team, and helped design an in-house rate-limiting library and two-factor authentication for admin users."
          - title: "Technology Consultant"
            company: "Lavanderia 60 Minutos"
            period: "Oct 2020 – Jan 2022"
            summary: "Technology consultant for the IT and management teams: led the software team, gathered requirements, and designed solutions for new projects and features."
          - title: "Senior Software Developer"
            company: "Lavanderia 60 Minutos"
            period: "Oct 2019 – Oct 2020"
            summary: "Designed the architecture of the software for a fully automated self-service laundry chain with 400+ stores across Brazil, building the management system, the store-terminal API, and the first Raspberry Pi touchscreen terminal."
          - title: "CTO"
            company: "Fractal Tecnologia"
            period: "Feb 2018 – Oct 2019"
            summary: "Led a team of 23 (developers, DevOps, QA, project managers, and designers) and defined the software architecture of all products and projects, working with product management and customers on requirements and custom solutions."
          - title: "Project Manager"
            company: "Fractal Tecnologia"
            period: "Jun 2017 – Feb 2018"
            summary: "Managed a team of 12 (developers, testers, and designers) across several company products and customer projects."
          - title: "Co-Founder"
            company: "InvestFest"
            period: "Jan 2017 – Aug 2019"
            summary: "Co-founded an event-ticketing startup and was responsible for the backend software architecture and API (Rails, Node.js, PostgreSQL, Redis, Sidekiq)."
          - title: "Rails Backend Developer"
            company: "Fractal Tecnologia"
            period: "Oct 2016 – Jun 2017"
            summary: "Built an API-only Rails 5 application with PostgreSQL, Redis, Sidekiq, RSpec, Cucumber, and Elasticsearch."
          - title: "Software Engineer"
            company: "Conductor Meios de Pagamento"
            period: "Apr 2016 – Oct 2016"
            summary: "Worked with Java, Oracle, and MS SQL Server, and acted as business analyst documenting new features and studying payment-system regulations."
          - title: "iOS Developer"
            company: "Gennovacap"
            period: "Apr 2015 – Apr 2016"
            summary: "Developed the Giusto app in Objective-C and Swift, using Parse as backend as a service."
          - title: "iOS Developer"
            company: "Mobilife"
            period: "Jul 2014 – Apr 2016"
            summary: "Developed institutional mobile apps for Mobilife customers in Objective-C and Swift."
          - title: "Development Manager"
            company: "Fácil Tecnologia"
            period: "May 2012 – Apr 2014"
            summary: "Managed a team of developers building PHP projects for payroll loan management."
          - title: "iOS Developer"
            company: "MVarandas Tecnologia"
            period: "Jan 2011 – Apr 2012"
            summary: "Built a new app that let waiters place restaurant orders."
          - title: "Web Developer"
            company: "NTI – UFPB"
            period: "Jan 2010 – Jan 2011"
            summary: "Developed the new enrollment system for the university entrance exam (COPERVE/UFPB) with Ruby on Rails and SCRUM, and worked on the exam results processing software with Ruby, PostgreSQL, and Oracle."
          - title: "Web Developer"
            company: "Conexão Comunicação"
            period: "Jan 2008 – Jul 2008"
            summary: "Built websites and content management systems in PHP and MySQL."
          - title: "Co-Founder"
            company: "ArmazemWeb Hosting"
            period: "Jan 2000 – Dec 2007"
            summary: "Co-founded a hosting company, leading customer support and web development."
      education:
        prompt: "cat education.txt"
        items:
          - institution: "IFPB — Federal Institute of Paraíba"
            credential: "Technologist Degree in Systems for the Internet"
            year: "2014"
          - institution: "Kapi'olani Community College"
            credential: "Certificates of Competence in Programming, Database Administration, and Help Desk Services"
            year: "2009"
      jampa_ruby:
        prompt: "cat jamparuby.txt"
        body_html: "I'm an active member of <a href=\"https://chat.whatsapp.com/Kan05TwASEtDItNK0ClCJT\">Jampa Ruby</a>, the Ruby developer community of Paraíba, Brazil — part of <a href=\"https://crudpb.org/\">CRUDPB</a>. Join the WhatsApp group and take part."
      projects:
        prompt: "cat projects.md"
        items:
          - name: "Lavanderia 60 Minutos"
            description: "Designed the software architecture for a fully automated self-service laundry chain with 400+ stores across Brazil. Built the management system and the API communicating with in-store attendant terminals, plus the first version of the attendant terminal itself, running on a Raspberry Pi with a touchscreen, kept in sync with the central system while able to operate offline."
            tags: "Ruby on Rails, Node.js, PostgreSQL, Sidekiq, Redis, Raspberry Pi"
          - name: "IBAPE-PB — Work Distribution System"
            description: "Fair-distribution system for professional engineering assessments for IBAPE-PB, via lottery and direct nomination, covering the full work lifecycle (creation, publication, draw, acceptance, completion) with reporting and email notifications."
            tags: "Ruby on Rails, PostgreSQL, Redis"
          - name: "Workspace Number Indicator"
            url: "https://github.com/nielsonrolim/workspace-number-indicator"
            description: "GNOME Shell extension that shows the current workspace number in the top panel, either as the current workspace alone (2) or current/total (2 / 4). Compatible with GNOME Shell 45–50. Open-source contribution."
            tags: "Open Source, GNOME Shell, GJS, JavaScript"
